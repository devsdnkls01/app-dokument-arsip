name: Build & Release Desktop App (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Single-File WPF Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore desktop/SuratApp.csproj

      - name: Publish Single-File Executable
        run: >
          dotnet publish desktop/SuratApp.csproj 
          -c Release 
          -r win-x64 
          --self-contained true 
          -p:PublishSingleFile=true 
          -p:IncludeNativeLibrariesForSelfExtract=true 
          -p:EnableCompressionInSingleFile=true 
          -o ./publish/desktop

      - name: Verify Executable Exists
        run: |
          Get-ChildItem -Path ./publish/desktop
          if (!(Test-Path "./publish/desktop/SuratApp.exe")) {
            throw "SuratApp.exe tidak ditemukan di folder publish!"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./publish/desktop/SuratApp.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
